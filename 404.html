      @font-face { font-family: 'Geist'; src: url('/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: 'Geist Mono'; src: url('/fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      :root { --obsidian: #101114; --ivory: #f4f2ed; --champagne: #b9a47c; --platinum: #c7cbd0; --muted: #8b8f96; --line-d: rgba(199, 203, 208, .12); }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px 16px; background: var(--obsidian); color: var(--ivory);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        background-image: radial-gradient(60% 50% at 80% 10%, rgba(185, 164, 124, .22), transparent 70%);
      }
      ::selection { background: var(--champagne); color: var(--obsidian); }
      main { width: min(560px, 100%); }
      .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ivory); text-decoration: none; font-weight: 640; font-size: 19px; letter-spacing: -.03em; }
      .logo svg { color: var(--platinum); }
      .code { margin-top: 64px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
      h1 { margin-top: 16px; font-size: clamp(40px, 9vw, 72px); line-height: .98; letter-spacing: -.05em; font-weight: 600; text-wrap: balance; }
      p { margin-top: 24px; font-size: 17px; line-height: 1.55; color: rgba(244, 242, 237, .7); text-wrap: pretty; }
      .actions { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
      .btn {
        display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: 999px; text-decoration: none;
        font-weight: 550; font-size: 15px; letter-spacing: -.01em; cursor: pointer;
        transition: transform .22s cubic-bezier(.16, 1, .3, 1), background-color .22s, border-color .22s;
      }
      .btn:active { transform: scale(.97); }
      .btn:focus-visible { outline: 2px solid var(--champagne); outline-offset: 3px; }
      .btn-ivory { background: var(--ivory); color: var(--obsidian); }
      .btn-ivory:hover { background: #fff; }
      .btn-line { border: 1px solid var(--line-d); color: var(--ivory); }
      .btn-line:hover { border-color: var(--platinum); }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
